<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
		<title>PSQLCarbon</title>
		<style>
			:root {
				--bg: #ffffff;
				--text: #161616;
				--muted: #6f6f6f;
				--border: #e0e0e0;
				--primary: #161616;
				--on-primary: #ffffff;
				--button: #f4f4f4;
				--button-hover: #e8e8e8;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #161618;
					--text: #f2f2f5;
					--muted: #a9a9ae;
					--border: #2e2e32;
					--button: #232326;
					--button-hover: #2e2e32;
					--primary: #f2f2f5;
					--on-primary: #161618;
				}
				.logo {
					filter: invert(1);
				}
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				height: 100%;
				background: var(--bg);
				color: var(--text);
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				-webkit-user-select: none;
				user-select: none;
			}
			body {
				display: flex;
				flex-direction: column;
				border: 1px solid var(--border);
				/* The window has no frame, the whole page drags it except the buttons */
				-webkit-app-region: drag;
			}
			main {
				flex: 1;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				padding: 32px 32px 16px;
				text-align: center;
			}
			.logo {
				width: 280px;
				height: auto;
			}
			.tagline {
				margin: 14px 0 0;
				font-size: 13px;
				color: var(--muted);
			}
			.status {
				display: flex;
				align-items: center;
				gap: 8px;
				margin-top: 22px;
				font-size: 12px;
				color: var(--muted);
			}
			.spinner {
				width: 12px;
				height: 12px;
				border: 2px solid var(--border);
				border-top-color: var(--primary);
				border-radius: 50%;
				animation: spin 0.8s linear infinite;
			}
			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}
			footer {
				padding: 16px 24px 20px;
				border-top: 1px solid var(--border);
				text-align: center;
			}
			.support {
				margin: 0 0 12px;
				font-size: 12px;
				color: var(--muted);
			}
			.buttons {
				display: flex;
				justify-content: center;
				gap: 8px;
				flex-wrap: wrap;
			}
			a.button {
				-webkit-app-region: no-drag;
				display: inline-flex;
				align-items: center;
				gap: 6px;
				padding: 8px 14px;
				font-size: 13px;
				color: var(--text);
				text-decoration: none;
				background: var(--button);
				border: 1px solid var(--border);
				cursor: pointer;
			}
			a.button:hover {
				background: var(--button-hover);
			}
			a.button.primary {
				color: var(--on-primary);
				background: var(--primary);
				border-color: var(--primary);
			}
			a.button.primary:hover {
				opacity: 0.85;
			}
			a.button svg {
				width: 14px;
				height: 14px;
				fill: currentColor;
			}
			a.button.open {
				margin-top: 18px;
			}
			/* Early access sign up, the main process sends it (electron/early-access.js) */
			form.pro {
				-webkit-app-region: no-drag;
				width: 100%;
				max-width: 300px;
				margin-top: 20px;
			}
			.pro-title {
				margin-bottom: 8px;
				font-size: 12px;
				font-weight: 500;
				text-align: center;
			}
			.pro input {
				display: block;
				width: 100%;
				padding: 6px 9px;
				font: inherit;
				font-size: 12px;
				color: var(--text);
				background: var(--bg);
				border: 1px solid var(--border);
				outline: none;
				-webkit-user-select: text;
				user-select: text;
			}
			.pro input:focus {
				border-color: var(--text);
			}
			.pro-buttons {
				display: flex;
				gap: 6px;
				margin-top: 6px;
			}
			.pro-buttons button {
				flex: 1;
				padding: 6px 0;
				font: inherit;
				font-size: 12px;
				color: var(--text);
				background: var(--button);
				border: 1px solid var(--border);
				cursor: pointer;
			}
			.pro-buttons button:hover {
				background: var(--button-hover);
			}
			.pro-buttons button.join {
				color: var(--on-primary);
				background: var(--primary);
				border-color: var(--primary);
			}
			.pro-buttons button.join:hover {
				opacity: 0.85;
			}
			.pro-buttons button:disabled {
				opacity: 0.5;
				cursor: default;
			}
			.pro-note {
				margin-top: 6px;
				font-size: 11px;
				color: var(--muted);
				text-align: center;
			}
			.pro-note.error {
				color: #dc2626;
			}
			[hidden] {
				display: none !important;
			}
			.version {
				margin-top: 12px;
				font-size: 11px;
				color: var(--muted);
			}
		</style>
	</head>
	<body>
		<main>
			<img class="logo" src="logo.svg" alt="PSQLCarbon" />
			<p class="tagline">A modern, AI-powered UI for your PostgreSQL databases</p>
			<form class="pro" id="pro" novalidate>
				<div class="pro-title" id="pro-title">Get early access to new features</div>
				<input type="email" id="pro-email" placeholder="you@example.com" aria-label="Email" autocomplete="email" />
				<div class="pro-buttons" id="pro-buttons">
					<button type="submit" class="join" id="pro-join">Join</button>
					<button type="button" id="pro-skip">Skip</button>
				</div>
				<div class="pro-note" id="pro-note">Only product news, unsubscribe anytime.</div>
			</form>
			<div class="status" id="starting"><span class="spinner"></span><span>Starting…</span></div>
		</main>
		<footer>
			<p class="support" id="support-text">PSQLCarbon is free and open source. If it helps you, please support it:</p>
			<div class="buttons">
				<a class="button" href="https://github.com/n-for-all/psqlcarbon" target="_blank" rel="noopener">
					<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z" /></svg>
					Star on GitHub
				</a>
				<a class="button" id="sponsor" href="https://github.com/sponsors/n-for-all" target="_blank" rel="noopener">
					<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m8 14.25.345.666a.75.75 0 0 1-.69 0l-.008-.004-.018-.01a7.152 7.152 0 0 1-.31-.17 22.055 22.055 0 0 1-3.434-2.414C2.045 10.731 0 8.35 0 5.5 0 2.836 2.086 1 4.25 1 5.797 1 7.153 1.802 8 3.02 8.847 1.802 10.203 1 11.75 1 13.914 1 16 2.836 16 5.5c0 2.85-2.045 5.231-3.885 6.818a22.066 22.066 0 0 1-3.744 2.584l-.018.01-.006.003h-.002Z" /></svg>
					Sponsor
				</a>
				<a class="button" href="https://psqlcarbon.com" target="_blank" rel="noopener">Website</a>
			</div>
			<div class="version" id="version"></div>
		</footer>
		<script>
			const params = new URLSearchParams(location.search);
			document.getElementById("version").textContent = params.get("version") ? `Version ${params.get("version")}` : "";
			// The App Store build may not link to donations (guideline 3.1.1)
			if (params.get("store") === "mas") {
				document.getElementById("sponsor").remove();
				document.getElementById("support-text").textContent = "PSQLCarbon is free and open source. If it helps you, a star on GitHub means a lot:";
			}

			// Early access: until someone joins, the app opens only once they join or skip (electron/main.js holds
			// it). Skipping asks again next time, joining is remembered and the splash then opens the app by itself.
			const form = document.getElementById("pro");
			const input = document.getElementById("pro-email");
			const join = document.getElementById("pro-join");
			const note = document.getElementById("pro-note");
			const starting = document.getElementById("starting");
			let sending = false;

			const showForm = window.psqlcarbon && params.get("joined") !== "1";
			form.hidden = !showForm;
			// The form takes the status line's place, it comes back while the app finishes starting
			starting.hidden = showForm;
			if (showForm) window.psqlcarbon.hold(true);

			const openApp = () => {
				form.hidden = true;
				starting.hidden = false;
				window.psqlcarbon?.hold(false);
			};
			document.getElementById("pro-skip").addEventListener("click", openApp);

			form.addEventListener("submit", async (event) => {
				event.preventDefault();
				if (sending) return;
				sending = true;
				join.disabled = true;
				join.textContent = "Joining…";
				note.className = "pro-note";
				note.textContent = "Only product news, unsubscribe anytime.";
				const result = await window.psqlcarbon.joinEarlyAccess(input.value);
				sending = false;
				join.disabled = false;
				join.textContent = "Join";
				if (result.ok) {
					document.getElementById("pro-title").textContent = "You're on the list, thank you.";
					input.hidden = true;
					document.getElementById("pro-buttons").hidden = true;
					note.textContent = "We'll email you when new features are ready.";
					setTimeout(openApp, 1500);
				} else {
					note.className = "pro-note error";
					note.textContent = result.message;
				}
			});
		</script>
	</body>
</html>
