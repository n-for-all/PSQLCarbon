<!doctype html>
<!-- Source of icon.png/icon.icns: the Q of the logo on a macOS style tile. Render at 1024x1024 with a transparent
     background (an offscreen Electron window works), then: sips for each iconset size and iconutil -c icns. -->
<html><head><style>html,body{margin:0;background:transparent;overflow:hidden}</style></head><body>
<div id="logo" style="position:absolute;left:0;top:0;width:0;height:0;overflow:hidden;visibility:hidden"></div>
<svg id="icon" xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px tile centred on the 1024 canvas, the margin is room for the shadow -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185" ry="185" fill="none" stroke="#000" stroke-opacity="0.08"/>
  <g id="q"></g>
</svg>
<script>
fetch("../splash/logo.svg").then((r) => r.text()).then((svg) => {
  document.getElementById("logo").innerHTML = svg;
  const q = document.querySelectorAll("#logo path")[2];
  const box = q.getBBox();
  // The Q fills about 58% of the tile, the tail sits slightly low so centre it optically a little higher
  const size = 824 * 0.58;
  const scale = size / Math.max(box.width, box.height);
  // Centre on the round part of the Q, the tail sticks out to the right and below
  const tx = 512 - (box.x + box.width * 0.455) * scale;
  const ty = 512 - (box.y + box.height * 0.47) * scale;
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", q.getAttribute("d"));
  path.setAttribute("fill", "#000");
  path.setAttribute("fill-rule", "nonzero");
  path.setAttribute("transform", `translate(${tx} ${ty}) scale(${scale})`);
  document.getElementById("q").appendChild(path);
  document.title = "ready";
});
</script></body></html>
